# Local environment: application + PostgreSQL + provider mock (WireMock) + OAuth 2.0 mock authorization server.
#   docker compose up --build
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: activation
      POSTGRES_USER: activation
      POSTGRES_PASSWORD: activation
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U activation -d activation"]
      interval: 5s
      timeout: 3s
      retries: 10

  provider-mock:
    image: wiremock/wiremock:3.13.2
    ports:
      - "8089:8080"
    volumes:
      - ./docker/wiremock:/home/wiremock:ro

  oauth:
    image: ghcr.io/navikt/mock-oauth2-server:6.1.3
    ports:
      - "8090:8080"
    environment:
      JSON_CONFIG_PATH: /config/oauth.json
    volumes:
      - ./docker/oauth:/config:ro

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/activation
      SPRING_DATASOURCE_USERNAME: activation
      SPRING_DATASOURCE_PASSWORD: activation
      # Tokens are requested from the host (localhost:8090), so that is the issuer inside them;
      # the keys are fetched over the compose network.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUERURI: http://localhost:8090/default
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: http://oauth:8080/default/jwks
      APP_PROVIDER_BASEURL: http://provider-mock:8080
      PROVIDER_API_KEY: local-dev-key
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    depends_on:
      postgres:
        condition: service_healthy
      provider-mock:
        condition: service_started
      oauth:
        condition: service_started
    stop_grace_period: 30s

volumes:
  pgdata:
